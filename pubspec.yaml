name: azure_ad_authentication
description: The Microsoft Authentication Library (MSAL) enables developers to
  acquire tokens from the Microsoft identity platform in order to authenticate
  users and access secured
version: 1.0.3
homepage: https://github.com/fabio21
repository: https://github.com/fabio21/azure_ad_authentication/issues
issue_tracker: https://github.com/fabio21/azure_ad_authentication/issues

environment:
  sdk: ^3.6.0
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  dartdoc: ^8.3.2
  flutter_lints: ^1.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.fsconceicao.azure_ad_authentication
        pluginClass: AzureAdAuthenticationPlugin
      ios:
        pluginClass: AzureAdAuthenticationPlugin
      macos:
        pluginClass: AzureAdAuthenticationPlugin
